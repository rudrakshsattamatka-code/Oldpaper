<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ank Khazana - Main Bazar</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Live Clock */
        #live-clock {
            font-size: 20px;
            font-weight: 700;
            color: #d32f2f;
            margin-bottom: 10px;
            background: #fff;
            padding: 8px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        /* Main Headline */
        .main-headline {
            font-size: 28px;
            font-weight: 800;
            color: #111;
            margin-top: 5px;
            margin-bottom: 15px;
            text-align: center;
            text-transform: uppercase;
            letter-spacing: 1px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }

        /* Main Card */
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 15px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.08);
            position: relative;
            overflow: hidden;
            padding-bottom: 15px;
        }

        /* Watermark - Now set to show ON TOP of content */
        .watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-35deg);
            font-size: 45px;
            font-weight: 800;
            color: rgba(0, 0, 0, 0.15); /* Transparent Black so it's visible but readable */
            z-index: 10; /* High z-index to stay above boxes */
            pointer-events: none;
            white-space: nowrap;
        }

        /* Header section */
        .header {
            background: linear-gradient(90deg, #ff9429 30%, #e65c00 100%);
            padding: 15px;
            display: flex;
            align-items: center;
            border-radius: 12px;
            margin: 10px;
            color: white;
            position: relative;
            z-index: 1;
        }
        .header-icon {
            width: 45px;
            height: 45px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
            margin-right: 12px;
            flex-shrink: 0;
        }
        .header-title {
            font-size: 22px;
            font-weight: 800;
            margin: 0;
            line-height: 1.2;
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Content Sections */
        .content-area {
            padding: 0 15px;
            position: relative;
            z-index: 1; 
        }

        /* Date & Live Badge */
        .date-row {
            background: #fff3e6;
            padding: 10px 15px;
            border-radius: 10px;
            margin-top: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            font-size: 14px;
            color: #7a3e14;
            border: 1px solid #ffe0c2;
        }
        .live-badge {
            background: #00c853;
            color: white;
            padding: 3px 10px;
            border-radius: 15px;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-dot {
            width: 6px;
            height: 6px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Sections */
        .section {
            margin-top: 15px;
        }
        .section-title {
            font-size: 13px;
            font-weight: 700;
            color: #444;
            margin-bottom: 6px;
        }

        .otc-box {
            background: #fff3e6;
            text-align: center;
            padding: 12px;
            border-radius: 10px;
            font-size: 28px;
            font-weight: 800;
            color: #cc4a00;
            border: 1px solid #ffe0c2;
        }

        .grid-dynamic {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }
        .box {
            text-align: center;
            padding: 10px 2px;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 800;
        }
        .box.green {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }
        .box.orange {
            background: #fff3e6;
            color: #cc4a00;
            border: 1px solid #ffe0c2;
        }

        /* Footer Info */
        .footer-info {
            text-align: center;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .footer-info p {
            margin: 0;
            font-size: 14px;
            font-weight: 600;
            color: #555;
        }
        .footer-info h2 {
            margin: 2px 0 0 0;
            font-size: 24px;
            color: #d32f2f;
            font-weight: 800;
        }

        /* Settings Button */
        .settings-btn {
            background: #333;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 20px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .settings-btn:hover {
            background: #000;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            margin-top: 0;
            font-size: 18px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #333;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        .form-note {
            font-size: 10px;
            color: #666;
            margin-top: 3px;
            display: block;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 15px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 6px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-save { background: #00c853; color: white; }
        .btn-cancel { background: #f44336; color: white; }

    </style>
</head>
<body>

    <!-- Live Clock -->
    <div id="live-clock">00:00:00 AM</div>

    <!-- Main Headline (Above Card) -->
    <h1 id="val-headline" class="main-headline">ANK KHAZANA</h1>

    <!-- Main Card -->
    <div class="card">
        <!-- Watermark Number (Now on TOP of content) -->
        <div id="val-watermark" class="watermark">987 654 3210</div>

        <!-- Header -->
        <div class="header">
            <div class="header-icon"></div>
            <h2 class="header-title" id="val-title">MAIN BAZAR</h2>
        </div>

        <div class="content-area">
            <!-- Date & Live Button -->
            <div class="date-row">
                <span id="val-datetime">31/07/2026 - 09:00 PM</span>
                <div class="live-badge">
                    <div class="live-dot"></div> LIVE
                </div>
            </div>

            <!-- OTC -->
            <div class="section">
                <div class="section-title">OTC</div>
                <div class="otc-box" id="val-otc">5 / 8</div>
            </div>

            <!-- PANEL -->
            <div class="section">
                <div class="section-title">PANEL</div>
                <!-- Dynamic Grid for Panel -->
                <div class="grid-dynamic" id="container-panels">
                    <!-- Numbers will be injected here via JS -->
                </div>
            </div>

            <!-- JODI -->
            <div class="section">
                <div class="section-title">JODI</div>
                <!-- Dynamic Grid for Jodi -->
                <div class="grid-dynamic" id="container-jodis">
                    <!-- Numbers will be injected here via JS -->
                </div>
            </div>
        </div>
    </div>

    <!-- Contact Info -->
    <div class="footer-info">
        <p>Call For Demo</p>
        <h2 id="val-phone">+91 9876543210</h2>
    </div>

    <!-- Settings Button -->
    <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h3>Edit Details</h3>
            
            <div class="form-group">
                <label>Top Headline</label>
                <input type="text" id="inp-headline">
            </div>
            <div class="form-group">
                <label>Market Name (Card Title)</label>
                <input type="text" id="inp-title">
            </div>
            <div class="form-group">
                <label>Watermark Background</label>
                <input type="text" id="inp-watermark">
            </div>
            <div class="form-group">
                <label>Date & Time</label>
                <input type="text" id="inp-datetime">
            </div>
            <div class="form-group">
                <label>OTC</label>
                <input type="text" id="inp-otc">
            </div>
            <div class="form-group">
                <label>PANEL</label>
                <input type="text" id="inp-panels">
                <span class="form-note">Put comma (,) between numbers (e.g. 348, 122, 288)</span>
            </div>
            <div class="form-group">
                <label>JODI</label>
                <input type="text" id="inp-jodis">
                <span class="form-note">Put comma (,) between numbers (e.g. 53, 58, 85)</span>
            </div>
            <div class="form-group">
                <label>Demo Mobile Number</label>
                <input type="text" id="inp-phone">
            </div>

            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-save" onclick="saveSettings()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        // Default Data Arrays for Dynamic Boxes
        let panelNumbers = ['348', '122', '288', '170'];
        let jodiNumbers = ['53', '58', '85', '80'];

        // Function to render dynamic boxes
        function renderBoxes(containerId, numbersArray, colorClass) {
            const container = document.getElementById(containerId);
            container.innerHTML = ''; 
            
            numbersArray.forEach(num => {
                let val = num.trim();
                if(val !== "") {
                    container.innerHTML += `<div class="box ${colorClass}">${val}</div>`;
                }
            });
        }

        // Initialize App
        function initApp() {
            renderBoxes('container-panels', panelNumbers, 'green');
            renderBoxes('container-jodis', jodiNumbers, 'orange');
        }

        // Live Clock logic
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            const strTime = hours + ':' + minutes + ':' + seconds + ' ' + ampm;
            document.getElementById('live-clock').innerText = strTime;
        }
        setInterval(updateClock, 1000);
        updateClock();
        initApp();

        // Settings Modal Logic
        const modal = document.getElementById('settings-modal');
        const textFields = ['headline', 'title', 'datetime', 'otc', 'phone', 'watermark'];

        function openSettings() {
            // Load Normal Texts
            textFields.forEach(field => {
                document.getElementById(`inp-${field}`).value = document.getElementById(`val-${field}`).innerText;
            });
            // Load Arrays joined by comma
            document.getElementById('inp-panels').value = panelNumbers.join(', ');
            document.getElementById('inp-jodis').value = jodiNumbers.join(', ');
            
            modal.style.display = 'flex';
        }

        function closeSettings() {
            modal.style.display = 'none';
        }

        function saveSettings() {
            // Save Normal Texts
            textFields.forEach(field => {
                let inputVal = document.getElementById(`inp-${field}`).value;
                document.getElementById(`val-${field}`).innerText = inputVal;
                
                // Show/Hide watermark entirely if empty
                if(field === 'watermark') {
                    document.getElementById('val-watermark').style.display = inputVal.trim() === '' ? 'none' : 'block';
                }
            });

            // Save & Render Arrays
            let panelsInput = document.getElementById('inp-panels').value;
            let jodisInput = document.getElementById('inp-jodis').value;
            
            panelNumbers = panelsInput.split(',');
            jodiNumbers = jodisInput.split(',');
            
            renderBoxes('container-panels', panelNumbers, 'green');
            renderBoxes('container-jodis', jodiNumbers, 'orange');

            closeSettings();
        }
    </script>
</body>
</html>
