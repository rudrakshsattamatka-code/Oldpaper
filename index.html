<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main Bazar Live</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            background-color: #f4f6f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* Live Clock */
        #live-clock {
            font-size: 24px;
            font-weight: 700;
            color: #d32f2f;
            margin-bottom: 20px;
            background: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            text-align: center;
        }

        /* Main Card */
        .card {
            background: #ffffff;
            width: 100%;
            max-width: 400px;
            border-radius: 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.05);
            overflow: hidden;
            padding-bottom: 20px;
        }

        /* Header section */
        .header {
            background: linear-gradient(90deg, #ff9429 30%, #e65c00 100%);
            padding: 25px 20px;
            display: flex;
            align-items: center;
            border-radius: 20px;
            margin: 10px;
            color: white;
            position: relative;
        }
        .header-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 12px;
            margin-right: 15px;
        }
        .header-title {
            font-size: 26px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Content Sections */
        .content-area {
            padding: 0 20px;
        }

        /* Date & Live Badge */
        .date-row {
            background: #fff3e6;
            padding: 12px 20px;
            border-radius: 12px;
            margin-top: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-weight: 700;
            color: #7a3e14;
            border: 1px solid #ffe0c2;
        }
        .live-badge {
            background: #00c853;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 5px;
        }
        .live-dot {
            width: 8px;
            height: 8px;
            background: white;
            border-radius: 50%;
            animation: blink 1s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        /* Sections (OTC, PANEL, JODI) */
        .section {
            margin-top: 20px;
        }
        .section-title {
            font-size: 14px;
            font-weight: 700;
            color: #555;
            margin-bottom: 8px;
        }

        .otc-box {
            background: #fff3e6;
            text-align: center;
            padding: 15px;
            border-radius: 12px;
            font-size: 32px;
            font-weight: 800;
            color: #cc4a00;
            border: 1px solid #ffe0c2;
        }

        .grid-4 {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        .box {
            text-align: center;
            padding: 12px 5px;
            border-radius: 8px;
            font-size: 18px;
            font-weight: 800;
        }
        .box.green {
            background: #e8f5e9;
            color: #1b5e20;
            border: 1px solid #c8e6c9;
        }
        .box.orange {
            background: #fff3e6;
            color: #cc4a00;
            border: 1px solid #ffe0c2;
        }

        /* Footer Info */
        .footer-info {
            text-align: center;
            margin-top: 25px;
            margin-bottom: 15px;
        }
        .footer-info p {
            margin: 0;
            font-size: 16px;
            font-weight: 600;
            color: #555;
        }
        .footer-info h2 {
            margin: 5px 0 0 0;
            font-size: 26px;
            color: #d32f2f;
            font-weight: 800;
        }

        /* Settings Button */
        .settings-btn {
            background: #333;
            color: white;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: 0.2s;
        }
        .settings-btn:hover {
            background: #000;
        }

        /* Settings Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        .modal {
            background: white;
            padding: 20px;
            border-radius: 15px;
            width: 90%;
            max-width: 400px;
            max-height: 90vh;
            overflow-y: auto;
        }
        .modal h3 {
            margin-top: 0;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }
        .flex-inputs {
            display: flex;
            gap: 5px;
        }
        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }
        .btn {
            flex: 1;
            padding: 10px;
            border: none;
            border-radius: 8px;
            font-weight: 700;
            cursor: pointer;
        }
        .btn-save { background: #00c853; color: white; }
        .btn-cancel { background: #f44336; color: white; }

    </style>
</head>
<body>

    <!-- Live Clock -->
    <div id="live-clock">00:00:00 AM</div>

    <!-- Main Card -->
    <div class="card">
        <div class="header">
            <div class="header-icon"></div>
            <h1 class="header-title" id="val-title">MAIN BAZAR</h1>
        </div>

        <div class="content-area">
            <!-- Date & Live Button -->
            <div class="date-row">
                <span id="val-datetime">31/07/2026 - 09:00 PM</span>
                <div class="live-badge">
                    <div class="live-dot"></div> LIVE
                </div>
            </div>

            <!-- OTC -->
            <div class="section">
                <div class="section-title">OTC</div>
                <div class="otc-box" id="val-otc">5 / 8</div>
            </div>

            <!-- PANEL -->
            <div class="section">
                <div class="section-title">PANEL</div>
                <div class="grid-4">
                    <div class="box green" id="val-p1">348</div>
                    <div class="box green" id="val-p2">122</div>
                    <div class="box green" id="val-p3">288</div>
                    <div class="box green" id="val-p4">170</div>
                </div>
            </div>

            <!-- JODI -->
            <div class="section">
                <div class="section-title">JODI</div>
                <div class="grid-4">
                    <div class="box orange" id="val-j1">53</div>
                    <div class="box orange" id="val-j2">58</div>
                    <div class="box orange" id="val-j3">85</div>
                    <div class="box orange" id="val-j4">80</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Contact Info -->
    <div class="footer-info">
        <p>Call For Demo</p>
        <h2 id="val-phone">+91 9876543210</h2>
    </div>

    <!-- Settings Button -->
    <button class="settings-btn" onclick="openSettings()">⚙️ Settings</button>

    <!-- Settings Modal -->
    <div class="modal-overlay" id="settings-modal">
        <div class="modal">
            <h3>Edit Card Details</h3>
            
            <div class="form-group">
                <label>Title</label>
                <input type="text" id="inp-title">
            </div>
            <div class="form-group">
                <label>Date & Time</label>
                <input type="text" id="inp-datetime">
            </div>
            <div class="form-group">
                <label>OTC</label>
                <input type="text" id="inp-otc">
            </div>
            <div class="form-group">
                <label>PANEL (4 values)</label>
                <div class="flex-inputs">
                    <input type="text" id="inp-p1">
                    <input type="text" id="inp-p2">
                    <input type="text" id="inp-p3">
                    <input type="text" id="inp-p4">
                </div>
            </div>
            <div class="form-group">
                <label>JODI (4 values)</label>
                <div class="flex-inputs">
                    <input type="text" id="inp-j1">
                    <input type="text" id="inp-j2">
                    <input type="text" id="inp-j3">
                    <input type="text" id="inp-j4">
                </div>
            </div>
            <div class="form-group">
                <label>Mobile Number</label>
                <input type="text" id="inp-phone">
            </div>

            <div class="modal-btns">
                <button class="btn btn-cancel" onclick="closeSettings()">Cancel</button>
                <button class="btn btn-save" onclick="saveSettings()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Script -->
    <script>
        // Live Clock logic
        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            let ampm = hours >= 12 ? 'PM' : 'AM';
            
            hours = hours % 12;
            hours = hours ? hours : 12; // the hour '0' should be '12'
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            const strTime = hours + ':' + minutes + ':' + seconds + ' ' + ampm;
            document.getElementById('live-clock').innerText = strTime;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Settings Modal Logic
        const modal = document.getElementById('settings-modal');
        const fields = ['title', 'datetime', 'otc', 'p1', 'p2', 'p3', 'p4', 'j1', 'j2', 'j3', 'j4', 'phone'];

        function openSettings() {
            // Load current text into inputs
            fields.forEach(field => {
                document.getElementById(`inp-${field}`).value = document.getElementById(`val-${field}`).innerText;
            });
            modal.style.display = 'flex';
        }

        function closeSettings() {
            modal.style.display = 'none';
        }

        function saveSettings() {
            // Save inputs text back to card
            fields.forEach(field => {
                document.getElementById(`val-${field}`).innerText = document.getElementById(`inp-${field}`).value;
            });
            closeSettings();
        }
    </script>
</body>
</html>
